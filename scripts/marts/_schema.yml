version: 2

models:
  - name: dim_customers
    description: >
      Customer dimension table following Kimball methodology.
      Enriched with lifetime order metrics, RFM-inspired segmentation,
      revenue tiers, and activity status.
      Grain: One row per customer.
    columns:
      - name: customer_key
        description: "Surrogate key — use this for joins from fact tables"
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "Natural key from source system"
        data_tests:
          - unique
          - not_null
      - name: email
        description: "Customer email, lowercased"
        data_tests:
          - unique
          - not_null
      - name: customer_segment
        description: "RFM-inspired segment: Never Purchased, One-Time Buyer, Repeat Customer, Loyal Customer"
        data_tests:
          - not_null
          - accepted_values:
              values: ['Never Purchased', 'One-Time Buyer', 'Repeat Customer', 'Loyal Customer']
      - name: revenue_tier
        description: "Revenue-based tier: No Revenue, Low Value, Medium Value, High Value, VIP"
        data_tests:
          - not_null
          - accepted_values:
              values: ['No Revenue', 'Low Value', 'Medium Value', 'High Value', 'VIP']
      - name: activity_status
        description: "Recency-based status: Never Active, Active, At Risk, Lapsed, Churned"
        data_tests:
          - not_null
      - name: lifetime_revenue
        description: "Total revenue from completed orders"
        data_tests:
          - not_null

  - name: dim_products
    description: >
      Product dimension table following Kimball methodology.
      Includes product hierarchy, pricing, and sales performance metrics.
      Grain: One row per product.
    columns:
      - name: product_key
        description: "Surrogate key — use this for joins from fact tables"
        data_tests:
          - unique
          - not_null
      - name: product_id
        description: "Natural key from source system"
        data_tests:
          - unique
          - not_null
      - name: product_name
        description: "Product display name"
        data_tests:
          - not_null
      - name: category
        description: "Top-level category"
        data_tests:
          - not_null
      - name: price_tier
        description: "Price-based tier: Budget, Mid-Range, Premium, Luxury"
        data_tests:
          - not_null
          - accepted_values:
              values: ['Budget', 'Mid-Range', 'Premium', 'Luxury']
      - name: unit_price
        description: "Current selling price in USD"
        data_tests:
          - not_null

  - name: dim_dates
    description: >
      Date dimension table generated using dbt_date package.
      Contains pre-calculated date attributes for efficient filtering.
      Grain: One row per calendar date from 2023-01-01 to 2025-12-31.
    columns:
      - name: date_key
        description: "Surrogate key for the date"
        data_tests:
          - unique
          - not_null
      - name: date_day
        description: "Calendar date (YYYY-MM-DD)"
        data_tests:
          - unique
          - not_null

  - name: fact_orders
    description: >
      Central fact table following Kimball star schema.
      Contains all order line items with foreign keys to dimension tables.
      Grain: One row per order line item.
      
      Join patterns:
      - fact_orders.customer_key = dim_customers.customer_key
      - fact_orders.product_key = dim_products.product_key
      - fact_orders.order_date = dim_dates.date_day
    columns:
      - name: order_fact_key
        description: "Surrogate key for the fact record"
        data_tests:
          - unique
          - not_null
      - name: customer_key
        description: "Foreign key to dim_customers"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_key
      - name: product_key
        description: "Foreign key to dim_products"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_key
      - name: order_id
        description: "Degenerate dimension — order identifier"
        data_tests:
          - not_null
      - name: quantity
        description: "Number of units in this line item"
        data_tests:
          - not_null
      - name: net_amount
        description: "Line item revenue after discounts"
        data_tests:
          - not_null
      - name: line_profit
        description: "Profit on this line item (net_amount - line_cost)"
      - name: order_status
        description: "Current status of the parent order"
        data_tests:
          - not_null

  - name: fact_daily_revenue
    description: >
      Pre-aggregated fact table for dashboard performance.
      Grain: One row per order_date + product_category.
      Only includes completed orders.
    columns:
      - name: order_date
        description: "Calendar date of orders"
        data_tests:
          - not_null
      - name: product_category
        description: "Product category for this aggregation"
        data_tests:
          - not_null
      - name: net_revenue
        description: "Total net revenue for this date + category"
        data_tests:
          - not_null
      - name: total_orders
        description: "Count of distinct orders"
        data_tests:
          - not_null
